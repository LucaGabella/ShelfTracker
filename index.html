<html lang="en">

<body>
<title>Shelf Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: one phone-width column. Green header band with Books/Films tabs, scrolling linen page, cream tab bar with a round green +. Light only, by choice. */
:root {
  --paper: #EFE6D6;
  --card: #F6EFE2;
  --ink: #2B2219;
  --muted: #6B5B47;
  --rule: #DCCFB6;
  --dot: #CDBB9C;
  --green: #2E4636;
  --green-2: #243A2C;
  --sage: #B9C8B0;
  --sage-2: #A3B69E;
  --cream: #F3ECDD;
  --wood: #8B5E3C;
  --wood-l: #D8B48A;
  --pale: #E2D5BD;
  --sel: #E6DAC3;
  --red: #A23B2A;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { height: 100%; background: var(--green); }
body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums lining-nums; }
.muted { color: var(--muted); }
.it { font-style: italic; }

.app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; position: relative; background: var(--paper); }
.top { flex: none; background: var(--green); color: var(--cream); padding: 18px 20px 0; border-radius: 0 0 18px 18px; display: flex; flex-direction: column; gap: 8px; }
.top.solo { padding-bottom: 14px; }
.top .row1 { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.eyebrow { font-style: italic; font-size: 14px; color: var(--sage); }
.top h1 { margin: 0; font: 600 32px/1.05 var(--display); text-wrap: balance; color: var(--cream); }
.tools { display: flex; flex: none; }
.ib { width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--cream); }
.ib svg { width: 21px; height: 21px; }
.tabs { display: flex; }
.tab { flex: 1; height: 44px; border: 0; background: none; font: 400 18px var(--display); color: var(--sage-2); border-bottom: 3px solid transparent; padding: 0; }
.tab[aria-selected="true"] { color: var(--cream); font-weight: 600; border-bottom-color: var(--wood-l); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 20px 28px; }

.lab { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.sec { padding: 16px 0; border-bottom: 1px dotted var(--dot); display: flex; flex-direction: column; gap: 10px; }
.sec:last-child { border-bottom: 0; }
.hint { font-style: italic; font-size: 13px; color: var(--muted); line-height: 1.45; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.banner { margin-top: 14px; }
.banner p { margin: 0; font-size: 14px; line-height: 1.45; }

.pills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 14px 0 2px; }
.pill { min-height: 46px; padding: 4px 2px; border-radius: 12px; border: 1px solid var(--dot); background: transparent; font-size: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
.pill small { font-size: 11px; opacity: .75; }
.pill[aria-pressed="true"] { background: var(--wood); border-color: var(--wood); color: #FBF6EC; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--dot); background: transparent; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--wood); border-color: var(--wood); color: #FBF6EC; }
.chip.small { min-height: 28px; padding: 0 10px; font-size: 12px; }

.listhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0 0; }
.sortsel { border: 0; background: transparent; font-style: italic; font-size: 14px; color: var(--muted); height: 40px; padding: 0 2px; -webkit-appearance: none; appearance: none; text-align: right; }
.item { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border: 0; border-bottom: 1px dotted var(--dot); background: none; width: 100%; text-align: left; }
.item b { font: 600 17px/1.2 var(--display); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .by { font-style: italic; font-size: 14px; color: var(--muted); }
.item .meta { font-size: 12px; color: var(--green); margin-top: 2px; }
.item .meta.warn { color: var(--red); }
.item .n { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stars { color: var(--wood); letter-spacing: .04em; font-size: 14px; white-space: nowrap; }
.cover { position: relative; display: flex; align-items: flex-end; flex: none; overflow: hidden; border-radius: 2px 4px 4px 2px; box-shadow: inset 3px 0 0 rgba(0,0,0,.18), 0 2px 4px rgba(60,40,20,.25); color: var(--cream); font-family: var(--display); font-weight: 600; line-height: 1.1; padding: 5px; }
.cover > span { overflow: hidden; word-break: break-word; }
.cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.divider { text-align: center; font-style: italic; font-size: 13px; color: var(--muted); padding: 12px 0 0; }
.empty { padding: 28px 0; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; color: var(--muted); line-height: 1.5; }

.btn { height: 50px; border: 0; border-radius: 12px; background: var(--green); color: var(--cream); font-weight: 600; font-size: 16px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; }
.btn.line { background: transparent; border: 1px solid var(--wood); color: var(--wood); }
.btn.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
.btn.danger.armed { background: var(--red); color: #FBF6EC; }
.btn.wide { width: 100%; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns .btn { flex: 1 1 140px; }
.link { min-height: 40px; border: 0; border-bottom: 1px solid var(--wood); background: none; padding: 0; font-style: italic; font-size: 15px; color: var(--wood); align-self: flex-start; }
.link.quiet { border-bottom-color: transparent; color: var(--muted); }

.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--wood); border-radius: 12px; overflow: hidden; }
.seg.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.seg button { height: 42px; border: 0; background: transparent; font-weight: 600; font-size: 14px; color: #5A4632; padding: 0 4px; }
.seg button + button { border-left: 1px solid var(--wood); }
.seg button[aria-pressed="true"] { background: var(--wood); color: #FBF6EC; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field input, .field select { height: 44px; border: 0; border-bottom: 1px solid var(--wood); background: transparent; font-size: 16px; padding: 0 2px; border-radius: 0; width: 100%; min-width: 0; }
.field textarea { min-height: 96px; border: 1px solid var(--rule); border-radius: 10px; background: var(--card); padding: 10px; font-size: 16px; line-height: 1.45; resize: vertical; width: 100%; }
.field textarea.code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 120px; }
.fields2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fields3 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.searchbox { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 12px; background: var(--card); }
.searchbox svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.searchbox input { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; outline: none; -webkit-appearance: none; appearance: none; }
.err { color: var(--red); font-size: 14px; font-weight: 600; }

.res { display: grid; grid-template-columns: 42px minmax(0, 1fr) 44px; gap: 12px; align-items: center; padding: 10px 8px; margin: 0 -8px; border-bottom: 1px dotted var(--dot); border-radius: 8px; }
.res.on { background: var(--sel); }
.res b { font: 600 16px/1.2 var(--display); }
.res .by { font-style: italic; font-size: 14px; color: var(--muted); }
.res .have { font-size: 12px; color: var(--green); }
.addb { width: 44px; height: 44px; border: 1.5px solid var(--wood); border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0; color: var(--wood); }
.addb svg { width: 20px; height: 20px; }
.addb[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--cream); }
.addfoot { flex: none; border-top: 1px solid var(--rule); padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; background: var(--card); }

.starsel { display: flex; gap: 2px; }
.starsel button { width: 40px; height: 44px; border: 0; background: none; font-size: 30px; line-height: 1; padding: 0; color: var(--pale); }
.starsel button.full { color: var(--wood); }
.starsel button.half { background: linear-gradient(90deg, var(--wood) 50%, var(--pale) 50%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.check .box { width: 22px; height: 22px; border: 1.5px solid var(--green); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--cream); }
.check[aria-checked="true"] .box { background: var(--green); }
.check .box svg { width: 14px; height: 14px; }
.check b { font: 600 16px var(--display); display: block; }
.review { margin: 0; font-style: italic; font-size: 15px; line-height: 1.55; border-left: 3px solid var(--wood-l); padding-left: 12px; white-space: pre-wrap; }

.dhead { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px; padding: 20px 0; border-bottom: 1px dotted var(--dot); }
.dhead h2 { margin: 0; font: 600 23px/1.15 var(--display); text-wrap: balance; overflow-wrap: anywhere; }
.dhead .info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.entry { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 50px; border: 0; border-bottom: 1px dotted var(--dot); background: none; padding: 4px 0; width: 100%; text-align: left; }

.month { padding: 18px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
.month b { font: 600 19px var(--display); }
.drow { display: grid; grid-template-columns: 30px 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; border: 0; border-bottom: 1px dotted var(--dot); background: none; width: 100%; padding: 6px 0; text-align: left; }
.drow .day { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.drow .day b { font: 600 18px var(--display); }
.drow .day span { font-size: 10px; letter-spacing: .06em; color: var(--muted); margin-top: 3px; }
.drow .n { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.drow .n b { font: 600 16px var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drow .n span { font-style: italic; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.track { height: 8px; border-radius: 4px; background: var(--pale); position: relative; }
.track > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--green); }
.track > .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--wood); border-radius: 0; }
.big { font: 600 52px/1 var(--display); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 16px 0; border-bottom: 1px dotted var(--dot); text-align: center; }
.tiles b { font: 600 22px var(--display); display: block; }
.tiles span { font-style: italic; font-size: 13px; color: var(--muted); }
.bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 100px; }
.bars div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100px; gap: 3px; font-size: 11px; color: var(--muted); }
.bars i { display: block; width: 100%; background: #C9AE88; border-radius: 3px 3px 0 0; }
.bars i.now { background: var(--green); }
.barlabels { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; font-style: italic; font-size: 11px; color: var(--muted); text-align: center; border-top: 2px solid var(--wood); padding-top: 4px; }
.rank { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: 5px; column-gap: 10px; font-size: 15px; }
.rank .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank b { font: 600 15px var(--display); }
.rank .track { grid-column: 1 / -1; height: 4px; }
.rank .track > i { background: var(--wood); }
.rdist { display: grid; grid-template-columns: 62px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 13px; }

.shelfrow { display: grid; grid-template-columns: minmax(0, 1fr) auto 16px; gap: 10px; align-items: center; min-height: 50px; border: 0; border-bottom: 1px dotted var(--dot); background: none; width: 100%; padding: 0; text-align: left; }
.shelfrow b { font: 600 16px var(--display); }
.shelfrow svg { width: 14px; height: 14px; color: var(--wood); }
.series { padding: 12px 0; border: 0; border-bottom: 1px dotted var(--dot); background: none; width: 100%; text-align: left; display: flex; flex-direction: column; gap: 7px; }
.series .h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.series b { font: 600 16px var(--display); }
.dots { display: flex; gap: 4px; }
.dots i { flex: 1; height: 7px; border-radius: 4px; background: var(--rule); }
.dots i.on { background: var(--green); }
.fmts { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; text-align: center; }
.fmts div { display: flex; flex-direction: column; gap: 1px; padding: 10px 0; background: var(--card); border: 1px solid var(--rule); border-radius: 12px; }
.fmts b { font: 600 19px var(--display); }
.fmts span { font-style: italic; font-size: 12px; color: var(--muted); }
.kindtag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--wood); }

nav.tabbar { flex: none; border-top: 1px solid var(--rule); background: var(--card); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px)); }
nav.tabbar button { justify-self: center; min-height: 44px; min-width: 44px; border: 0; background: none; font-size: 14px; color: var(--muted); padding: 0 4px; }
nav.tabbar button[aria-current="page"] { color: var(--green); font-weight: 600; font-style: italic; }
nav.tabbar .plus { width: 50px; height: 50px; border-radius: 50%; background: var(--green); color: var(--cream); display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(30,50,35,.35); }
nav.tabbar .plus svg { width: 22px; height: 22px; }

.toast { position: absolute; left: 20px; right: 20px; bottom: 96px; background: var(--ink); color: var(--cream); padding: 12px 14px; font-size: 14px; border-radius: 12px; z-index: 5; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.toast button { border: 0; background: none; color: var(--wood-l); font-weight: 700; text-decoration: underline; min-height: 32px; padding: 0 4px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } } }
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="main" tabindex="-1"></main>
  <div id="foot"></div>
  <nav class="tabbar" id="nav" aria-label="Main"></nav>
  <div class="toast" id="toast" role="status" hidden></div>
</div>

<script>
(function () {
'use strict';

/* ---------- storage ---------- */
var KEY = 'shelf-log-v1';
function loadState() { try { var t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
var saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch (e) { if (!saveWarned) { saveWarned = true; setTimeout(function () { toast('Couldn’t save: the phone’s storage for this app is full. Remove some cover photos, then back up.'); saveWarned = false; }, 50); } return false; }
}

/* ---------- helpers ---------- */
function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseD(s) { return Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10)); }
function fmtD(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function addDays(s, n) { return fmtD(parseD(s) + n * 86400000); }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function thisYear() { return +todayStr().slice(0, 4); }
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
function dateNice(d) { return +d.slice(8, 10) + ' ' + MONTHS[+d.slice(5, 7) - 1].slice(0, 3) + ' ' + d.slice(0, 4); }
function weekday(d) { return WD[new Date(parseD(d)).getUTCDay()]; }
function ago(d) {
  var n = daysBetween(d, todayStr());
  if (n <= 0) return 'today'; if (n === 1) return '1 day'; if (n < 14) return n + ' days';
  if (n < 63) return Math.round(n / 7) + ' weeks'; var m = Math.round(n / 30.4); return m + (m === 1 ? ' month' : ' months');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim(); }
function intOrNull(v) { var n = parseInt(String(v || '').replace(/[^0-9]/g, ''), 10); return isFinite(n) && n > 0 ? n : null; }
function starsText(r) { if (!r) return ''; var s = ''; for (var i = 1; i <= 5; i++) s += r >= i * 2 ? '★' : (r === i * 2 - 1 ? '½' : ''); return s; }
function ratingWords(r) { return r ? (r % 2 ? Math.floor(r / 2) + '½' : r / 2) + ' of 5' : 'Not rated'; }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }

var ICON = {
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  menu: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>'
};

/* ---------- words that change between books and films ---------- */

    var fallback = function () { if (box) { box.focus(); box.select(); } toast('Text selected. Copy it from the box.'); };
    try { navigator.clipboard.writeText(ui.exportText).then(done, fallback); } catch (e) { fallback(); }
  },
  importText: function () { restore(val('importText') || ''); },
  loadSample: function () { var snap = snapshot(); S = sampleState(); save(); ui.shelf = null; ui.year = thisYear(); go('library'); toast('Sample data loaded', snap); },
  clearSample: function () { var snap = snapshot(); S = emptyState(); save(); ui.shelf = null; ui.filter = 'all'; go('library'); toast('Cleared. Ready for your own books and films.', snap); },
  reset: function () {
    if (ui.armed !== 'reset') { ui.armed = 'reset'; return keepScroll(render); }
    var snap = snapshot(); S = emptyState(); save(); ui.exportText = ''; ui.shelf = null; go('library'); toast('Everything erased', snap);
  }
};

function shareFile(text, name, mime, done, fallback) {
  try {
    var file = new File([text], name, { type: mime });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(done, function (err) { if (err && err.name === 'AbortError') return; fallback(); });
      return;
    }
  } catch (e) {}
  fallback();
}
function restore(text) {
  try {
    var obj = JSON.parse(text);
    if (!obj || !Array.isArray(obj.items) || !Array.isArray(obj.diary)) throw new Error('shape');
    var snap = snapshot();
    S = upgrade(obj); save(); ui.shelf = null; ui.filter = 'all'; go('library'); toast('Backup restored', snap);
  } catch (e) { toast('That doesn’t look like a backup from this app.'); }
}
try {
  if (navigator.storage && navigator.storage.persisted) {
    navigator.storage.persisted().then(function (p) {
      if (p || !navigator.storage.persist) { storageKept = !!p; return; }
      return navigator.storage.persist().then(function (g) { storageKept = !!g; });
    }).catch(function () {});
  }
} catch (e) {}

/* ---------- events ---------- */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var fn = A[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el); }
});
var reviewTimer = null;
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'a-q' && ui.add) { ui.add.q = t.value; clearTimeout(searchTimer); if (!t.value.trim()) { searchSeq++; ui.add.results = []; ui.add.loading = false; ui.add.error = ''; refreshAdd(); return; } searchTimer = setTimeout(runSearch, 450); }
  else if (t.id === 's-q') { ui.query = t.value; document.getElementById('s-results').innerHTML = searchResults(); }
  else if (t.id === 'd-review') { var it = itemById(ui.detailId); if (it) { it.review = t.value; clearTimeout(reviewTimer); reviewTimer = setTimeout(save, 400); } }
  else if (t.id === 'm-title' && ui.add) { ui.add.m.title = t.value; document.getElementById('foot').innerHTML = addFootHtml(); }
  else if (t.id === 'd-lent-to') { var i2 = itemById(ui.detailId); if (i2 && i2.lent) { i2.lent.to = t.value.trim(); save(); } }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'l-sort') { ui.sort = t.value; keepScroll(render); }
  else if (t.id === 'd-lent-since') { var it = itemById(ui.detailId); if (it && it.lent && t.value) { it.lent.since = t.value; save(); } }
  else if (t.id === 'sh-name') { var s = shelfById(ui.shelf), n = t.value.trim(); if (s && n) { s.name = n; save(); toast('Shelf renamed'); } else if (s) t.value = s.name; }
  else if (t.id === 'set-goal-book' || t.id === 'set-goal-film') {
    var k = goalKey(t.id === 'set-goal-book' ? 'book' : 'film', thisYear()), v = intOrNull(t.value);
    if (v) S.goals[k] = v; else delete S.goals[k]; save(); toast(v ? 'Goal saved' : 'Goal removed');
  }
  else if (t.id === 'csvFile' && t.files && t.files[0]) {
    var cr = new FileReader();
    cr.onload = function () {
      try { ui.csv = planCsvImport(String(cr.result)); ui.exportText = ''; keepScroll(render); var cp = document.getElementById('csvPreview'); if (cp) cp.scrollIntoView({ block: 'center' }); }
      catch (e) { toast(e.message || 'That file couldn’t be read as a CSV.'); }
      t.value = '';
    };
    cr.readAsText(t.files[0]);
  }
  else if (t.id === 'set-tmdb') { S.settings.tmdb = t.value.trim(); save(); }
  else if (t.id === 'importFile' && t.files && t.files[0]) { var rd = new FileReader(); rd.onload = function () { restore(String(rd.result)); }; rd.readAsText(t.files[0]); }
  else if ((t.id === 'm-cover' || t.id === 'e-cover') && t.files && t.files[0]) {
    var isEdit = t.id === 'e-cover';
    if (isEdit) readEdit(); else readAddManual();
    readPhoto(t.files[0], function (data) { if (isEdit && ui.edit) ui.edit.cover = data; else if (ui.add) ui.add.m.cover = data; keepScroll(render); });
  }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target.id;
  if (id === 'a-q') { ev.preventDefault(); clearTimeout(searchTimer); runSearch(); ev.target.blur(); }
  else if (id === 's-q' || id === 'd-lent-to' || id === 'en-note' || id === 'sh-name' || /^m-|^e-|^set-/.test(id)) { ev.preventDefault(); ev.target.blur(); }
  else if (id === 'g-val') { ev.preventDefault(); A.saveGoal(); }
  else if (id === 's-newshelf') { ev.preventDefault(); A.saveShelf(); }
  else if (id === 'd-newshelf') { ev.preventDefault(); A.saveShelfInline(); }
});

render();
if (firstRun) toast('Sample books and films loaded so you can try it out');

if (window.__PWA__ && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
}
window.__shelf = { state: function () { return S; }, computeStats: computeStats, seriesList: seriesList, ui: ui };
})();
</script>
